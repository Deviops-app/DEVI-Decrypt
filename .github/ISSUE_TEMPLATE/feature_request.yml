name: Feature request
description: Suggest an improvement for DEVI Decrypt.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem you are trying to solve in your casework. Do not include real evidence, case material, keys, or personal data.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like DEVI Decrypt to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else?
      description: Workarounds you use today, or how other tools handle this.
